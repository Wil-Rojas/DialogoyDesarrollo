<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Diálogo y Desarrollo</title>
    <link rel="stylesheet" href="../../vendors/typicons.font/font/typicons.css">
    <link rel="stylesheet" href="../../vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="../../css/vertical-layout-light/style.css">
    <link rel="shortcut icon" href="../../images/favicon.png" />
</head>
<body>
    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth">
                <div class="row w-100">
                    <div class="col-lg-4 mx-auto">
                        <div class="auth-form-light text-left p-5">
                            <div class="brand-logo">
                                <img src="../../images/logo.svg" alt="Logo">
                            </div>
                            <h4>Iniciar Sesión</h4>
                            <h6 class="font-weight-light">Panel de Administración</h6>
                            <form id="loginForm" class="pt-3">
                                <div class="form-group">
                                    <input type="email" id="email" class="form-control form-control-lg" placeholder="Correo electrónico" required>
                                </div>
                                <div class="form-group">
                                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Contraseña" required>
                                </div>
                                <div id="loginMessage" class="text-danger mb-3"></div>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn">INICIAR SESIÓN</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    $(document).ready(function() {
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            var email = $('#email').val();
            var password = $('#password').val();
            $('#loginMessage').html('Verificando...');
            $.ajax({
                url: '../../api/login.php',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({email: email, password: password}),
                success: function(response) {
                    if (response.success) {
                        window.location.href = '../../index.html';
                    } else {
                        $('#loginMessage').html('<span class="text-danger">' + response.message + '</span>');
                    }
                },
                error: function() {
                    $('#loginMessage').html('<span class="text-danger">Error de conexión con el servidor</span>');
                }
            });
        });
    });
    </script>
</body>
</html>
